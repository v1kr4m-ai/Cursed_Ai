plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

// The ggml Vulkan backend compiles GLSL compute shaders to SPIR-V at build
// time via glslc. Rather than requiring a separate LunarG Vulkan SDK install,
// point CMake at the copy the Android NDK already bundles for native Vulkan
// game development.
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localProps.load(new FileInputStream(localPropsFile))
}
def sdkDir = localProps.getProperty('sdk.dir') ?: System.getenv('ANDROID_HOME')
def ndkVer = "26.1.10909125"
def isWindows = org.gradle.internal.os.OperatingSystem.current().isWindows()
def isMac = org.gradle.internal.os.OperatingSystem.current().isMacOsX()
def hostTag = isWindows ? "windows-x86_64" : (isMac ? "darwin-x86_64" : "linux-x86_64")
def glslcPath = "${sdkDir}/ndk/${ndkVer}/shader-tools/${hostTag}/glslc${isWindows ? '.exe' : ''}"

android {
    namespace 'com.sunayna.runtime'
    compileSdk 34
    ndkVersion "26.1.10909125"

    defaultConfig {
        applicationId "com.sunayna.runtime"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -fexceptions"
                // Vulkan is force-disabled in CMakeLists.txt until the LunarG Vulkan SDK
                // is installed (see the comment there). -DVulkan_GLSLC_EXECUTABLE is inert
                // while that's the case, but stays wired so flipping GGML_VULKAN back on
                // there is the only change needed once the SDK is present.
                arguments "-DVulkan_GLSLC_EXECUTABLE=${glslcPath}"
            }
        }
        
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += 'META-INF/INDEX.LIST'
            excludes += 'META-INF/io.netty.versions.properties'
        }
        jniLibs {
            useLegacyPackaging = false
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    
    // Ktor for Localhost API
    implementation "io.ktor:ktor-server-core:2.3.7"
    implementation "io.ktor:ktor-server-netty:2.3.7"
    implementation "io.ktor:ktor-server-content-negotiation:2.3.7"
    implementation "io.ktor:ktor-serialization-kotlinx-json:2.3.7"
    
    // Coroutines for streaming
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
